# Configuration file

general {
    # Total world-time and sleeper-fatigue rate vs one vanilla world tick during Case B (>=50% and <100%). Default 2.0 = double (vanilla +1 already ran; Tweaks adds multiplier-1). Mobs and awake players remain at 1x tick rate.
    # Min: 1.0
    # Max: 100.0
    D:"Case B Partial Sleep Time Multiplier"=2.0

    # Broadcast Morpheus-style chat notifications when players enter/leave bed and when fast-forward sleep begins.
    B:"Enable Sleep Notifications"=true

    # Master toggle for AQTweaks Somnia enhancements. When enabled, AQTweaks controls sleep threshold, time multipliers, and fatigue rates, overriding Somnia's corresponding config keys.
    B:"Enable Somnia Module"=true

    # Points of Somnia fatigue recovered per in-game hour spent sleeping in bed (1 in-game hour = 1000 ticks). Default: 10.0.
    # Min: 0.0
    # Max: 100.0
    D:"Fatigue Recovered Per In-Game Hour"=10.0

    # Percentage of non-spectator players required to activate time fast-forward (0.50 = 50%). Below this is Case C.
    # Min: 0.01
    # Max: 1.0
    D:"Sleep Percentage Threshold"=0.5
}


