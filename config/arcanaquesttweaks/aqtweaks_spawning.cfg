# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Filter InControl/vanilla potential spawn lists by pack surface vs underground ids.
##########################################################################################################

general {
    # Cave pick when Y is strictly below this and sky light is at or below Max Cave Sky Light.
    # Min: -64
    # Max: 256
    I:"Cave Max Y"=60

    # Master switch. When false, PotentialSpawns is not filtered.
    B:"Enable Spawning Module"=true

    # At the spawn pick coordinate, drop surface-only mobs in caves and underground-only mobs on the surface.
    B:"Filter Potential Spawns"=true

    # Closed cave if sky light (0-15) is <= this. 0 avoids treating forest canopy as cave.
    # Min: 0
    # Max: 15
    I:"Max Cave Sky Light"=0

    # Only EnumCreatureType.MONSTER. Animals, water, and ambient are unchanged.
    B:"Monster Only"=true

    # Only dimension 0. Nether/End lists are unchanged.
    B:"Overworld Only"=true

    # Pack JSON under the Forge config directory. Default is DEVBOX config/arcanaquest/mob_overworldspawntype.json. Tweaks does not ship or write this file.
    S:"Spawn Type File"=arcanaquest/mob_overworldspawntype.json
}


