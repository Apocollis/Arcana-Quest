# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Filter InControl/vanilla potential spawn lists by pack surface vs underground ids.
##########################################################################################################

general {
    # Cave pick when Y is strictly below this and sky light is at or below Max Cave Sky Light.
    # Min: -64
    # Max: 256
    I:"Cave Max Y"=60

    # Master switch. When false, PotentialSpawns is not filtered and pack fill is off.
    B:"Enable Spawning Module"=true

    # After the first ticking spawn, roll a pack size in [min, max] and place more of that mob nearby. Uses InControl group counts unless overridden.
    B:"Fill Pack Size"=true

    # At the spawn pick coordinate, drop surface-only mobs in caves and underground-only mobs on the surface.
    B:"Filter Potential Spawns"=true

    # Hard ceiling for rolled pack size and overrides.
    # Min: 1
    # Max: 16
    I:"Group Size Cap"=8

    # modid:path=min-max (or min,max). Overrides InControl group counts for that id. Delete a line to use InControl.
    S:"Group Size Overrides" <
        grimoireofgaia:goblin_feral=3-5
     >

    # Closed cave if sky light (0-15) is <= this. 0 avoids treating forest canopy as cave.
    # Min: 0
    # Max: 15
    I:"Max Cave Sky Light"=0

    # Placement tries (each with a Y scan) to finish a pack after the first mob.
    # Min: 1
    # Max: 64
    I:"Max Extra Attempts"=24

    # Only EnumCreatureType.MONSTER. Animals, water, and ambient are unchanged.
    B:"Monster Only"=true

    # Only dimension 0. Nether/End lists are unchanged.
    B:"Overworld Only"=true

    # XZ radius around the first mob for extra members.
    # Min: 1
    # Max: 16
    I:"Pack Radius"=8

    # Pack JSON under the Forge config directory. Default is DEVBOX config/arcanaquest/mob_overworldspawntype.json. Tweaks does not ship or write this file.
    S:"Spawn Type File"=arcanaquest/mob_overworldspawntype.json

    # Vertical scan around the first mob so cave floors still fill when vanilla ΔY is 0.
    # Min: 0
    # Max: 16
    I:"Y Range"=8
}


