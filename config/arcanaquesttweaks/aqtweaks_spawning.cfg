# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Filter InControl/vanilla potential spawn lists by pack surface vs underground ids.
##########################################################################################################

general {
    # Ticks to wait after a failed cage spawn attempt. Does not change successful spawn delay (vanilla 200-800). 1 is the minimum to avoid every-tick retry.
    # Min: 1
    # Max: 200
    I:"Cage Fail Recheck Delay"=20

    # Cave pick when Y is strictly below this and sky light is at or below Max Cave Sky Light.
    # Min: -64
    # Max: 256
    I:"Cave Max Y"=60

    # After a natural ticking spawn, place companions from pack JSON. Cage spawners and TC portals never trigger this.
    B:"Enable Mixed Groups"=true

    # Master switch. When false, PotentialSpawns is not filtered, pack fill and mixed groups are off, the hostile cap is vanilla 70, and cage fail delay is not applied.
    B:"Enable Spawning Module"=true

    # After the first ticking spawn, roll a pack size in [min, max] from pack mob_tier + mob_spawnrules unless overridden.
    B:"Fill Pack Size"=true

    # At the spawn pick coordinate, drop surface-only mobs in caves and underground-only mobs on the surface.
    B:"Filter Potential Spawns"=true

    # Hard ceiling for rolled pack size and overrides.
    # Min: 1
    # Max: 16
    I:"Group Size Cap"=8

    # modid:path=min-max (or min,max). Overrides pack tier group counts for that id. Delete a line to use the tier table.
    S:"Group Size Overrides" <
        grimoireofgaia:goblin_feral=3-5
     >

    # EnumCreatureType.MONSTER max used by findChunksForSpawning. Vanilla is 70. Does not affect animals, water, ambient, cage spawners, or TC portals.
    # Min: 1
    # Max: 1000
    I:"Hostile Mob Cap"=140

    # Closed cave if sky light (0-15) is <= this. 0 avoids treating forest canopy as cave.
    # Min: 0
    # Max: 15
    I:"Max Cave Sky Light"=0

    # Placement tries (each with a Y scan) to finish a pack after the first mob.
    # Min: 1
    # Max: 64
    I:"Max Extra Attempts"=24

    # Only EnumCreatureType.MONSTER. Animals, water, and ambient are unchanged.
    B:"Monster Only"=true

    # Only dimension 0. Nether/End lists are unchanged.
    B:"Overworld Only"=true

    # XZ radius around the first mob for extra members.
    # Min: 1
    # Max: 16
    I:"Pack Radius"=8

    # Pack JSON under the Forge config directory. Tweaks does not ship or write this file. Missing file turns mixed groups off.
    S:"Spawn Parties File"=arcanaquest/mob_spawnparties.json

    # Pack Forge cfg under the Forge config directory. *_group_min / *_group_max per tier. Tweaks does not ship or write this file.
    S:"Spawn Rules File"=arcanaquest/mob_spawnrules.cfg

    # Pack JSON under the Forge config directory. Maps entity ids to common/uncommon/rare/…. Tweaks does not ship or write this file.
    S:"Spawn Tier File"=arcanaquest/mob_tier.json

    # Pack JSON under the Forge config directory. Default is DEVBOX config/arcanaquest/mob_overworldspawntype.json. Tweaks does not ship or write this file.
    S:"Spawn Type File"=arcanaquest/mob_overworldspawntype.json

    # Vertical scan around the first mob so cave floors still fill when vanilla ΔY is 0.
    # Min: 0
    # Max: 16
    I:"Y Range"=8
}


