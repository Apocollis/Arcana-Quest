# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# RandomPortals landings into Twilight Forest.
##########################################################################################################

general {
    # Biome registry names that are never valid RandomPortals landings in the destination dimension, including for non-players. Empty entries ignored.
    S:"Always Unsafe Biomes" <
        twilightforest:dark_forest_center
        twilightforest:fire_swamp
        twilightforest:twilight_glacier
        twilightforest:thornlands
        twilightforest:highlands_center
     >

    # Twilight Forest dimension id. Pack default is 7.
    I:"Destination Dimension ID"=7

    # When true, RandomPortals destinations in Destination Dimension ID reroute out of locked biomes and landmarks, and new pads require grass.
    B:"Enable Twilight Forest Portal Safety"=true

    # If any non-empty names are set, the landing biome must also be one of these registry names. Empty = unused.
    S:"Safe Biome Allowlist" <
     >
}


