# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Tweaks mineshaft rate, spacing, ocean skip, and tunnel Y.
##########################################################################################################

general {
    # Only chunks whose X and Z are multiples of this may roll. 1 = no grid. New chunks only.
    # Min: 1
    # Max: 64
    I:"Chunk Spacing"=4

    # When true, Tweaks owns mineshaft can-spawn (rate, chunk spacing, ocean/beach skip) and tunnel Y. When false, parent Better Mineshafts canSpawn and Y run; locate pin and failed-entrance stub still apply.
    B:"Enable Better Mineshafts Tweaks"=true

    # Chance a spacing-eligible land chunk gets a shaft. Tweaks owns this roll; Better Mineshafts cfg spawn rate is unused while Enable is true. New chunks only.
    # Min: 0.0
    # Max: 1.0
    D:"Mineshaft Spawn Rate"=0.001

    # Skip biome-provider ocean and beach at the chunk center (Y=64). Off lets shafts roll there.
    B:"Skip Ocean And Beach"=true

    # Highest Y for the start tunnel. Clamped to 255. Swapped with min if inverted. Does not go into Depths −Y.
    # Min: 1
    # Max: 255
    I:"Tunnel Max Y"=37

    # Lowest Y for the start tunnel (local copy; does not rewrite Better Mineshafts variant settings). Clamped to 1. New chunks only.
    # Min: 1
    # Max: 255
    I:"Tunnel Min Y"=17
}


