# Configuration file

##########################################################################################################
# client
#--------------------------------------------------------------------------------------------------------#
# Client-only visuals for negative Y
##########################################################################################################

client {
    # When below Y = 0 in the Overworld, apply dark gray fog starting about 32 blocks from the camera. Client-only. Skipped in water/lava.
    B:"Deep Cave Fog"=true

    # When below Y = 0 in the Overworld, skip rendering the skybox (sun, moon, stars, sky dome). Client-only.
    B:"Hide Skybox Below Y 0"=true
}


##########################################################################################################
# compatibility
#--------------------------------------------------------------------------------------------------------#
# Per-mod negative-Y hooks
##########################################################################################################

compatibility {
    # Should YUNG's Better Caves bedrock generation layer be shifted down to Minimum World Y?
    B:"Adjust Better Caves Bedrock Height"=true

    # Should YUNG's Better Caves -Y compatibility hooks run (e.g. surface altitude utils)? Separate from Better Depths Caves generation.
    B:"Enable Better Caves Negative Y"=true

    # Should CoFH World features evaluate and place blocks below Y = 0 down to Minimum World Y?
    B:"Enable CoFH World Negative Y"=true

    # Should Recurrent Complex Volts placement rays scan below Y = 0 down to Minimum World Y?
    B:"Enable Recurrent Complex Negative Y"=true
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Core Depths Update compatibility
##########################################################################################################

general {
    # Enable AQTweaks Depths cave generation (BC-style upper tunnels, chambers, lower deep, sparse shafts, Y0 mouths into +Y Better Caves). Affects new chunks only. When false, AQTweaks skips that carve path.
    B:"Better Depths Caves"=true

    # Should negative Y-level compatibility enhancements be enabled for Depths Update?
    B:"Enable Depths Module"=true

    # The minimum Y coordinate boundary of the world (defaults to -64 for Depths Update).
    # Min: -256
    # Max: 0
    I:"Minimum World Y Elevation"=-64
}


structures {
    B:"Enable RTG Village Terrain Smoothing"=true
}


