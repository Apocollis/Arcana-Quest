# Configuration file

##########################################################################################################
# surface
#--------------------------------------------------------------------------------------------------------#
# RTG surface height and structure placement tweaks
##########################################################################################################

surface {
    # Apply village-skip and land settle to Astral Sorcery surface shrines.
    B:"Enable Astral Shrine Settle"=true

    # Allow Astral small shrines as a village building, at most once per village.
    B:"Enable Astral Small Shrine Village Piece"=true

    # Skip Bewitchment Cambion houses that overlap a village. No land plate; paste is Y+1 only.
    B:"Enable Cambion House Settle"=true

    # Apply village-skip and land settle to Mystical World thatch huts (not barrows).
    B:"Enable Mystical Hut Settle"=true

    # Flatten RTG land under village components (houses, farms, well, roads) and the 12-block yards between them, then blend into surrounding hills.
    B:"Enable RTG Village Terrain Smoothing"=true

    # Fill under and ramp around those structures after they place. Does not rewrite the structure blocks.
    B:"Enable Structure Land Settle"=true

    # Treat the village start bounding box (yards, roads, gaps) as Village for isInsideStructure / InControl, not only child pieces.
    B:"Enable Village Bounding Box Detection"=true

    # Veto a village if the well is ocean-like (ocean, kelp forest, coral reef, WATER), a river, or a flooded watercourse. Pure beach is allowed if ocean/river is not inside the coast buffer. Swamp wells are allowed.
    B:"Reject Coastal Village Starts"=true

    # Cancel Astral shrines, Bewitchment Cambion houses, and Mystical World huts if they would overlap a village.
    B:"Skip Structures On Village"=true

    # If a village house or Recurrent Complex building would touch a river or ocean, skip it and retry nearby land. Swamp pieces stay and get a land pad. Roads/docks are not skipped.
    B:"Skip Water Village Pieces"=true

    # Max blocks of land buffer around small Astral shrines/ruins (wild settle rim and village shrine flatten). 0 = footprint only.
    # Min: 0
    # Max: 16
    I:"Small Shrine Pad"=3

    # Max blocks to fill downward under a structure pad. 0 = no fill.
    # Min: 0
    # Max: 64
    I:"Structure Fill Depth"=16

    # Blocks of slope from large shrine and hut pads down to surrounding terrain. Small Astral shrines/ruins use Small Shrine Pad instead. 0 = no rim.
    # Min: 0
    # Max: 64
    I:"Structure Rim Bank"=16

    # Blocks above the pad surface that still count as Village. Floor is the pad; below the pad is not Village.
    # Min: 0
    # Max: 256
    I:"Village Box Height"=32

    # Extra blocks outside the village start AABB that still count as Village for detection, and the swamp dock-approach slope radius. Flattening uses per-component pads, not this value.
    # Min: 0
    # Max: 64
    I:"Village Box XZ Pad"=8

    # Chebyshev blocks around the well. Veto if ocean-like or river is closer than this. Distance at or beyond this is allowed. 0 = well column only.
    # Min: 0
    # Max: 128
    I:"Village Coast Buffer"=32

    # Full-plate blocks around each land component (including roads). Overlapping pads fill yards between houses and paths. 0 = piece AABB only.
    # Min: 0
    # Max: 64
    I:"Village Component Pad"=12

    # Blocks of Hermite slope beyond the component pad, back to raw RTG. 0 = hard pad edge. Existing cfg with 48 stays 48 until changed.
    # Min: 0
    # Max: 256
    I:"Village Edge Falloff"=48

    # Write village terrain traces to logs/villagepatch.log (not latest.log). On for diagnostic capture.
    B:"Village Flatten Debug"=true

    # Village wells and wet-column checks treat RTG terrain below this Y as water. Vanilla sea level is 63.
    # Min: 1
    # Max: 255
    I:"Village Min Well Height"=65

    # Inside the village box: 0 = fully flat plate at the box-average height. 30 = allow at most 1 block of height change per 30 blocks from the plate center.
    # Min: 0
    # Max: 256
    I:"Village Plate Slope"=0

    # Blocks of slope from the plate down to water or shore. 0 = old vertical cutoff at the waterline.
    # Min: 0
    # Max: 64
    I:"Village Water Bank"=16

    # How far (blocks) to step back or sideways along the street when retrying a water village piece. 0 = skip only, no retry.
    # Min: 0
    # Max: 48
    I:"Village Water Retry Distance"=20
}


