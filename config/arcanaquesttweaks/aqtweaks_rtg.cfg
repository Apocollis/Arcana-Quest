# Configuration file

##########################################################################################################
# surface
#--------------------------------------------------------------------------------------------------------#
# RTG surface height and structure placement tweaks
##########################################################################################################

surface {
    # Hermite slope beyond Cambion House Pad, raise-only, back to RTG. Default 12.
    # Min: 0
    # Max: 64
    I:"Cambion House Falloff"=12

    # Radius around a Cambion house AABB used to fill air holes up to ground Y. Default 6. Does not raise the pad above plains.
    # Min: 0
    # Max: 32
    I:"Cambion House Pad"=6

    # Apply village-skip and land settle to Astral Sorcery surface shrines.
    B:"Enable Astral Shrine Settle"=true

    # Allow Astral small shrines as a village building, at most once per village.
    B:"Enable Astral Small Shrine Village Piece"=true

    # Skip Bewitchment Cambion houses that overlap a village. House pastes one above ground (cobble on the grass). The 6-pad stays at plains Y and only fills air holes.
    B:"Enable Cambion House Settle"=true

    # Apply village-skip, nearby retry, and land settle to Mystical World thatch huts. Barrows skip/retry on village overlap but are not plated.
    B:"Enable Mystical Hut Settle"=true

    # Flatten RTG land under village components (well, roads, houses) with a 12-block hard pad around each. Overlapping pads are the village plate. Never fill ocean or river biomes.
    B:"Enable RTG Village Terrain Smoothing"=true

    # Fill under and ramp around those structures after they place. Does not rewrite the structure blocks.
    B:"Enable Structure Land Settle"=true

    # Treat the flatten plate (Village Component Pad plus Village Edge Falloff around land boxes, including kept roads and yards) as Village for isInsideStructure / InControl. Y is well-shaft floor through plate plus Village Box Height. New villages also save that volume as extra Village.dat pieces.
    B:"Enable Village Bounding Box Detection"=true

    # Veto a village only if the well is ocean/river (or RTG river) and there is no dry land within Village Water Retry Distance. Land wells too close to ocean still fail Village Coast Buffer. Dry land below Village Min Well Height is kept and raised. Nearby river does not cancel a dry well.
    B:"Reject Coastal Village Starts"=true

    # Cancel Astral shrines and Bewitchment Cambion houses on village overlap. Mystical World huts/barrows and Bewitchment stone circles/menhir/wickerman skip that spot and retry nearby. Vanilla water lakes and BOP water/quicksand lakes that overlap a village pad are skipped. Lava lakes are not skipped.
    B:"Skip Structures On Village"=true

    # If a village house, Recurrent Complex building, waystone, shrine, or path would touch river, ocean, or flooded water, skip it and retry inland. Paths that still touch ocean/river or are mostly lake after retry are omitted. Swamp and other non-ocean water under the pad is filled up to plate Y.
    B:"Skip Water Village Pieces"=true

    # Max blocks of land buffer around small Astral shrines/ruins (wild settle rim and village shrine flatten). 0 = footprint only.
    # Min: 0
    # Max: 16
    I:"Small Shrine Pad"=3

    # Max blocks to fill downward under a structure pad. 0 = no fill.
    # Min: 0
    # Max: 64
    I:"Structure Fill Depth"=16

    # Blocks of slope from large shrine and hut pads down to surrounding terrain. Small Astral shrines/ruins use Small Shrine Pad instead. 0 = no rim.
    # Min: 0
    # Max: 64
    I:"Structure Rim Bank"=16

    # Blocks above the pad surface that still count as Village. Floor is the well shaft (about 11-14 below the plate). Existing cfg with 32 stays 32 until changed.
    # Min: 0
    # Max: 256
    I:"Village Box Height"=32

    # Swamp dock-approach slope radius for flatten only. Detection uses Village Component Pad, not this value.
    # Min: 0
    # Max: 64
    I:"Village Box XZ Pad"=8

    # Chebyshev blocks around a dry land well. Veto if ocean-like is closer than this. Nearby river does not cancel. Distance at or beyond this is allowed. 0 = well column only.
    # Min: 0
    # Max: 128
    I:"Village Coast Buffer"=16

    # Full-plate radius around each land component (well, roads, houses, RC). Overlapping pads form the village footprint. Default 12.
    # Min: 0
    # Max: 64
    I:"Village Component Pad"=12

    # Blocks of Hermite slope beyond the component pad, back to raw RTG. 0 = hard pad edge. Existing cfg with 48 stays 48 until changed.
    # Min: 0
    # Max: 256
    I:"Village Edge Falloff"=12

    # Write village terrain traces to logs/villagepatch.log (not latest.log). Off by default: appends stall chunk gen. Turn on only while diagnosing villages.
    B:"Village Flatten Debug"=false

    # Dry village wells and lake/flood plate floors use at least this Y. River/ocean columns are never filled. Vanilla sea level is 63.
    # Min: 1
    # Max: 255
    I:"Village Min Well Height"=64

    # Replace the outside-facing plate rim (8-connected to non-plate / ocean) with stone brick below the plate top. Top stays sand/grass. Inland cliffs are unchanged.
    B:"Village Ocean Wall"=true

    # Inside the village box: 0 = fully flat plate at the box-average height. 30 = allow at most 1 block of height change per 30 blocks from the plate center.
    # Min: 0
    # Max: 256
    I:"Village Plate Slope"=0

    # Fill 1-block ocean/river notches inside the hard pad (cardinal-enclosed or 7 of 8 land neighbors). Not a pier into open water.
    B:"Village Shore Close Ocean"=true

    # Open 1-block sand jetties off the coastal plate and close 1-block notches. Houses and roads stay plated.
    B:"Village Shore Smooth"=true

    # Chebyshev kernel for shore opening. 1 = default. 0 = no opening (hole fill still uses Village Shore Close Ocean).
    # Min: 0
    # Max: 2
    I:"Village Shore Smooth Radius"=1

    # Blocks of slope from the plate down to water or shore. 0 = old vertical cutoff at the waterline.
    # Min: 0
    # Max: 64
    I:"Village Water Bank"=16

    # How far (blocks) to walk inland when retrying a water village piece (street, then toward the well). 0 = skip only, no retry.
    # Min: 0
    # Max: 48
    I:"Village Water Retry Distance"=32
}


