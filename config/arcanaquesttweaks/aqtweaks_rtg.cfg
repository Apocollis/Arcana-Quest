# Configuration file

##########################################################################################################
# surface
#--------------------------------------------------------------------------------------------------------#
# RTG surface height and structure placement tweaks
##########################################################################################################

surface {
    # Should RTG terrain around villages be flattened to the village bounding box, then blended into surrounding hills?
    B:"Enable RTG Village Terrain Smoothing"=true

    # Treat the village start bounding box (yards, roads, gaps) as Village for isInsideStructure / InControl, not only child pieces.
    B:"Enable Village Bounding Box Detection"=true

    # Veto a village if the well is in ocean, a river biome, or a flooded watercourse. Swamp and beach wells are allowed.
    B:"Reject Coastal Village Starts"=true

    # If a village house or Recurrent Complex building would touch a river or ocean, skip it and retry nearby land. Swamp pieces stay and get a land pad. Roads/docks are not skipped.
    B:"Skip Water Village Pieces"=true

    # Blocks above the pad surface that still count as Village. Floor is the pad; below the pad is not Village.
    # Min: 0
    # Max: 256
    I:"Village Box Height"=32

    # Extra blocks outside the village hull that still count as Village and are fully flattened. 0 = exact hull.
    # Min: 0
    # Max: 64
    I:"Village Box XZ Pad"=8

    # Blocks around the well to scan for deep ocean. 0 = well column only.
    # Min: 0
    # Max: 128
    I:"Village Coast Buffer"=32

    # Blocks outside the village bounding box to blend from flattened height back to raw RTG terrain. 0 = hard village box only.
    # Min: 0
    # Max: 256
    I:"Village Edge Falloff"=48

    # Write village terrain traces to logs/villagepatch.log (not latest.log). On for diagnostic capture.
    B:"Village Flatten Debug"=true

    # Village wells and wet-column checks treat RTG terrain below this Y as water. Vanilla sea level is 63.
    # Min: 1
    # Max: 255
    I:"Village Min Well Height"=65

    # Inside the village box: 0 = fully flat plate at the box-average height. 30 = allow at most 1 block of height change per 30 blocks from the plate center.
    # Min: 0
    # Max: 256
    I:"Village Plate Slope"=0

    # How far (blocks) to step back or sideways along the street when retrying a water village piece. 0 = skip only, no retry.
    # Min: 0
    # Max: 48
    I:"Village Water Retry Distance"=20
}


