# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Gate Chisel crafts behind Recipe Stages / Game Stages.
##########################################################################################################

general {
    # Recipe Stages that can lock a Chisel output. Empty = every captured stage. Pack defaults are the Building skill stages.
    S:"Chisel Stage Allowlist" <
        apprentice_builder
        experienced_builder
        master_builder
     >

    # When false, Chisel GUI and in-world carving are not gated by Recipe Stages.
    B:"Enable Game Stages Module"=true
}


