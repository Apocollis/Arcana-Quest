# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Spatial rift items and entity.
##########################################################################################################

general {
    # Blocks around the player to pull standing owned pets and leashed mobs.
    # Min: 4.0
    # Max: 32.0
    D:"Companion Radius"=16.0

    # If false, rift items do not attune or open. Registry still loads.
    B:"Enable Portal Module"=true

    # Blocks in front of the destination rift to stand after teleport.
    # Min: 0.5
    # Max: 4.0
    D:"Exit Offset"=1.5

    # How long both rifts stay open. 1200 = 60 seconds.
    # Min: 20
    # Max: 24000
    I:"Rift Lifespan Ticks"=1200

    # Blocks along look direction to place the source rift in front of the player.
    # Min: 0.5
    # Max: 4.0
    D:"Spawn Offset"=3.0

    # Vanilla-style timeUntilPortal after a trip so entities do not bounce. 80 = 4 seconds.
    # Min: 1
    # Max: 400
    I:"Teleport Cooldown Ticks"=80

    # Maximum blocks from the player for an unstable tear landing.
    # Min: 32
    # Max: 16000
    I:"Wild Max Distance"=4000

    # Minimum blocks from the player for an unstable tear landing.
    # Min: 16
    # Max: 8000
    I:"Wild Min Distance"=6000

    # Random land columns to try before giving up.
    # Min: 8
    # Max: 256
    I:"Wild Search Attempts"=48
}


