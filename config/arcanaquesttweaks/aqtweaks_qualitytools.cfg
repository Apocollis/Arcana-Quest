# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Quality Tools Module: loot stamp, wear/break overlays, Dawnstone rune upgrades.
##########################################################################################################

general {
    # Broken (dark_gray) repaired to at least this remaining/max ratio, and still below Clear Wear, becomes the wear tier (gray). QualityBase is kept.
    # Min: 0.01
    # Max: 1.0
    D:"Broken To Wear"=0.26

    # Wear (gray), or Broken repaired in one step past this remaining/max ratio, drops the damage stamp and restores QualityBase. Exactly this ratio does neither.
    # Min: 0.01
    # Max: 1.0
    D:"Clear Wear"=0.51

    # sccraftingrunes Common Rune (itemcommonmat). Place the tool first, then this rune. red→white, white→yellow, yellow reroll. common_mat is accepted as an alias.
    S:"Common Rune"=sccraftingrunes:common_mat

    # Master switch. When false, QT living-update stamp is not skipped and Tweaks wear/break/runes/loot stamp are off.
    B:"Enable Quality Tools Module"=true
    D:"High Durability"=0.75

    # blue→gold, then gold reroll. legendary_mat is accepted as an alias.
    S:"Legendary Rune"=sccraftingrunes:legendary_mat

    # Wear overlay may apply at or below this remaining/max ratio. Broken items never take wear.
    # Min: 0.01
    # Max: 1.0
    D:"Low Durability"=0.2

    # green→blue, then blue reroll. rare_mat is accepted as an alias.
    S:"Rare Rune"=sccraftingrunes:rare_mat

    # Log one INFO line (quality-wear ...) for every durability damage check. Off by default: it floods latest.log. Turn on only while diagnosing wear and break.
    B:"Trace Wear"=false

    # yellow→green, then green reroll. uncommon_mat is accepted as an alias.
    S:"Uncommon Rune"=sccraftingrunes:uncommon_mat

    # Multiplier on used × (ref / (max/2)). 0 disables wear. 1 is the default curve.
    # Min: 0.0
    # Max: 1.0
    D:"Wear Chance"=1.0

    # Maximum p after the curve when Wear Chance is above 0. Stops low-max tools from a near-certain first roll.
    # Min: 0.0
    # Max: 1.0
    D:"Wear Chance Ceiling"=0.5

    # Minimum p after the curve when Wear Chance is above 0.
    # Min: 0.0
    # Max: 1.0
    D:"Wear Chance Floor"=0.05

    # Minimum ticks between wear roll attempts on one stack.
    # Min: 1
    # Max: 1200
    I:"Wear Check Interval Ticks"=40

    # Reference max durability (vanilla iron tool = 250). Hardness term is ref / (max/2).
    # Min: 1
    # Max: 100000
    I:"Wear Durability Ref"=250
}


