# Configuration file

##########################################################################################################
# hud
#--------------------------------------------------------------------------------------------------------#
# Client overlay placement. Does not change Elenai feather or thirst icons.
##########################################################################################################

hud {
    # If Toughness Bar is loaded, draw it above armor (left), left to right. Feathers and thirst stay above hunger (right).
    B:"Move Toughness Bar To Armor Side"=true
}


##########################################################################################################
# relight
#--------------------------------------------------------------------------------------------------------#
# Client-side repair of light emitters that arrive dark in chunk data.
##########################################################################################################

relight {
    # Log one [AQ-CLIENT-RELIGHT] line per minute with sections scanned, stale emitters found and checks run. Off by default.
    B:"Client Relight Debug"=false

    # When a chunk arrives on the client, scan it for torches, lanterns and other emitters whose stored light is too low and re-run the light check for them, so they light without placing a torch nearby. Spread over client ticks. Restart after change.
    B:"Enable Client Relight Sweep"=true
}


##########################################################################################################
# tooltips
#--------------------------------------------------------------------------------------------------------#
# Client item tooltip lines.
##########################################################################################################

tooltips {
    # Add Metallurgy-style harvest / durability / efficiency lines to non-Metallurgy pickaxes, axes, shovels, and tools.
    B:"Metallurgy Tooltip Compat"=true
}


