# Lethal-save effect knobs. Layout/cost stay under Perks.
##########################################################################################################

respite {
    # Ticks after a save before it can fire again. 1200 = 60 seconds.
    # Min: 0
    # Max: 12000
    I:"Cooldown Ticks"=1200

    # Min: 0
    # Max: 10
    I:"Defence Amplifier"=0
    S:"Defence Potion ID"=teastory:defence

    # Regen II and Tea Story defence duration. 100 = 5 seconds.
    # Min: 1
    # Max: 12000
    I:"Effect Duration Ticks"=100
    S:"Perk ID"=aqtweaks:respite

    # 0 = Regeneration I, 1 = Regeneration II.
    # Min: 0
    # Max: 10
    I:"Regen Amplifier"=1
}


