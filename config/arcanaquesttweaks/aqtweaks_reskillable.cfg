        thaumcraft
        botania
        rustic
        teastory
        astralsorcery
        mysticalworld
     >
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Master switch for per-level Reskillable drip bonuses. Stamina perk ids stay in aqtweaks_stamina.cfg.
##########################################################################################################

general {
    # If false, no per-level attributes, harvest extras, magic multiply, or EB building bonuses.
    B:"Enable Reskillable Bonuses"=true
}


magic {
    # If isMagicDamage is false, still treat damageType (lowercase prefix) as spell-like. Default fireball = ghast/blaze/Lich. TC foci use the Thaumcraft mixin, not this list. Do not add thrown (snowballs). Instance files keep an empty list until edited.
    S:"Allow Type Prefixes" <
     >

    # Astromancer craftingTickTime multiply. 0.8 = 25% faster.
    # Min: 0.25
    # Max: 1.0
    D:"Altar Craft Time"=0.8

    # Min: 0
    # Max: 25
    I:"Astral Temp Min"=9

    # Unsaved generic.maxHealth add while Blood Pact is unlocked. −8 = four hearts.
    # Min: -40.0
    # Max: 0.0
    D:"Blood Pact Max Health"=-8.0

    # Outgoing classified Magic multiply after drip, before Full Font.
    # Min: 1.0
    # Max: 4.0
    D:"Blood Pact Outgoing"=2.0

    # Min: 0
    # Max: 25
    I:"Cinder Temp Max"=15

    # Min: 0.1
    # Max: 1.0
    D:"Cinder Ward Fire"=0.8

    # Min: 0.0
    # Max: 1.0
    D:"Cinder Ward Heal"=0.2

    # Exact damageType strings that never count as spell-like.
    S:"Deny Types" <
        wither
        onFire
        lava
        hotFloor
     >

    # Extra machine tick when world time modulo this is 0.
    # Min: 1
    # Max: 40
    I:"Foundry Pulse Every"=4

    # Chunk vis / aura base at or above this counts as full. Flux is ignored.
    # Min: 0.0
    # Max: 1.0
    D:"Full Font Aura Ratio"=0.9

    # Outgoing classified Magic / Heal-focus after drip and Blood Pact, then the stamp clears.
    # Min: 1.0
    # Max: 4.0
    D:"Full Font Output"=1.5

    # Multiply ItemCaster.consumeVis amount before Vis Thrift when the aura is full.
    # Min: 1.0
    # Max: 4.0
    D:"Full Font Vis Cost"=1.5

    # Generating-flower addMana multiply while a Druid is in range.
    # Min: 1.0
    # Max: 2.0
    D:"Grove Mana"=1.15

    # Min: 1.0
    # Max: 64.0
    D:"Grove Range"=24.0

    # Min: 1.0
    # Max: 2.0
    D:"Hearth Altar Gain"=1.15

    # Spell-like LivingHurtEvent multiply, capped at 40%. 0.0125 → ±20% at 16, ±40% at 32.
    # Min: 0.0
    # Max: 0.1
    D:"Hurt Multiply Per Level"=0.0125

    # Min: 1.0
    # Max: 2.0
    D:"Live Spark"=1.2

    # Min: 1.0
    # Max: 2.0
    D:"Living Edge"=1.15

    # INFO-log unique damageType / isMagicDamage / source classes for player-involved hits (cap 48). Use to lock allow prefixes after a gauntlet shot.
    B:"Log Damage Classify"=true

    # Min: 0.0
    # Max: 1.0
    D:"Mana Veil Absorb"=0.2

    # Min: 1
    # Max: 100000
    I:"Mana Veil Per HP"=1000

    # Subtract round(fraction × incident bound) from warp severity after visor.
    # Min: 0.0
    # Max: 1.0
    D:"Quiet Mind Bound Fraction"=0.35
    S:"Quiet Mind Cancel Chat"=Whispers try to cloud your thoughts, but you push them away...

    # Parent resource spend multiply on the school perk (mana, ritual drain, altar starlight, Ember).
    # Min: 0.1
    # Max: 1.0
    D:"School Thrift"=0.7

    # Min: 1.0
    # Max: 2.0
    D:"Star Powered Damage"=1.25

    # Added to CasterManager.getTotalVisDiscount when Vis Thrift is unlocked. 0.30 = 30% off foci and Arcane Workbench.
    # Min: 0.0
    # Max: 0.9
    D:"Vis Thrift Add"=0.3
}


mining {
    # BreakSpeed multiply: speed × (1 + level × k). 0.01 → +16% at 16, +32% at 32.
    # Min: 0.0
    # Max: 0.25
    D:"Break Speed Per Level"=0.01

    # Pickaxes with Mining Expert treat harvest as at least this level. Vanilla diamond = 3 (4 tooltip stars).
    # Min: 0
    # Max: 16
    I:"Mining Expert Harvest Floor"=3
}


