# Configuration file

##########################################################################################################
# bow drawing
#--------------------------------------------------------------------------------------------------------#
# Configure bow-drawing stamina consumption
##########################################################################################################

"bow drawing" {
    # Stamina cost (in half-feathers) charged instantly upon drawing a bow
    # Min: 0
    # Max: 2147483647
    I:"Bow Draw Cost"=2

    # Stamina cost (in half-feathers) consumed per hold interval
    # Min: 0
    # Max: 2147483647
    I:"Bow Hold Cost"=1

    # Ticks between feather consumption while holding a bow fully drawn (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Bow Hold Tick Interval"=20

    # Does drawing and holding a bow consume stamina?
    B:"Enable Bow Stamina Cost"=true
}


##########################################################################################################
# climbing
#--------------------------------------------------------------------------------------------------------#
# Configure ladder, vine, and rope climbing stamina consumption
##########################################################################################################

climbing {
    # Multiplier applied to the climb interval while holding/clinging without ascending (2 = half the ascend drain rate)
    # Min: 1
    # Max: 2147483647
    I:"Cling Interval Multiplier"=2

    # Does ascending or clinging to ladders/vines consume stamina?
    B:"Enable Climbing Stamina Cost"=true

    # Does ascending or clinging to ropes consume stamina?
    B:"Enable Rope Climb Cost"=true

    # If true, the player will lose their grip and fall/slide when out of stamina.
    B:"Fall on Stamina Depleted"=true

    # Stamina cost (in half-feathers) per ascend interval on ladders
    # Min: 0
    # Max: 2147483647
    I:"Ladder Climb Cost"=1

    # Ticks between feather consumption while ascending ladders (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Ladder Climb Tick Interval"=20

    # Stamina cost (in half-feathers) per ascend interval on ropes
    # Min: 0
    # Max: 2147483647
    I:"Rope Climb Cost"=3

    # Ticks between feather consumption while ascending ropes (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Rope Climb Tick Interval"=20

    # Stamina cost (in half-feathers) per ascend interval on vines
    # Min: 0
    # Max: 2147483647
    I:"Vine Climb Cost"=3

    # Ticks between feather consumption while ascending vines (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Vine Climb Tick Interval"=20
}


##########################################################################################################
# dynamic sword skills
#--------------------------------------------------------------------------------------------------------#
# Stamina cost when Dynamic Sword Skills activate. All stock skills default to 0 for in-game tuning.
##########################################################################################################

"dynamic sword skills" {
    # Half-feathers spent if a skill is missing from Skill Costs. 0 = free.
    # Min: 0
    # Max: 2147483647
    I:"Default Skill Cost"=0

    # Should Dynamic Sword Skills spend Elenai feathers when a skill triggers?
    B:"Enable DSS Skill Stamina Cost"=true

    # If true, DSS hunger exhaustion is skipped and feathers are the cost instead.
    B:"Replace Hunger Exhaustion"=true

    # Per-skill costs as registry_name=cost. 0 = free. Tune in this cfg without rebuilding.
    S:"Skill Costs" <
        dynamicswordskills:basic_technique=0
        dynamicswordskills:armor_break=0
        dynamicswordskills:dodge=0
        dynamicswordskills:leaping_blow=0
        dynamicswordskills:parry=0
        dynamicswordskills:dash=0
        dynamicswordskills:spin_attack=0
        dynamicswordskills:super_spin_attack=0
        dynamicswordskills:mortal_draw=0
        dynamicswordskills:sword_break=0
        dynamicswordskills:rising_cut=1
        dynamicswordskills:ending_blow=0
        dynamicswordskills:back_slice=0
        dynamicswordskills:sword_beam=2
     >
}


##########################################################################################################
# grapple mod
#--------------------------------------------------------------------------------------------------------#
# Configure grappling hook stamina consumption
##########################################################################################################

"grapple mod" {
    # Does active grappling consume stamina?
    B:"Enable Grapple Stamina Cost"=true

    # Stamina cost (in half-feathers) per climb interval
    # Min: 0
    # Max: 2147483647
    I:"Grapple Climb Cost"=3

    # Ticks between feather consumption while reeling in / climbing the rope (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Grapple Climb Tick Interval"=20

    # Stamina cost (in half-feathers) per hold interval. Lower than climb/swing; 1 is the minimum non-zero cost.
    # Min: 0
    # Max: 2147483647
    I:"Grapple Hold Cost"=1

    # Ticks between feather consumption while hanging still (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Grapple Hold Tick Interval"=20

    # Stamina cost (in half-feathers) per swing interval
    # Min: 0
    # Max: 2147483647
    I:"Grapple Swing Cost"=2

    # 3D speed at or above which hanging becomes swinging. High enough to ignore small hook bob; pendulum arcs still keep swing cost through the apex.
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Grapple Swing Speed Threshold"=0.35

    # Ticks between feather consumption while swinging (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Grapple Swing Tick Interval"=20

    # Ember consumed per motor interval (40 = one standard Ember pulse)
    # Min: 0.0
    # Max: 1.7976931348623157E308
    D:"Motor Ember Cost"=40.0

    # Ticks between Ember consumption while the motor is pulling (20 ticks = 1 second)
    # Min: 1
    # Max: 2147483647
    I:"Motor Ember Tick Interval"=20

    # If true, motor pull also consumes portable Ember (jar / cartridge / bulb). Ignored if Embers is not loaded.
    B:"Motor Requires Ember"=true

    # If true, an active motor pull drains hang stamina instead of climb/swing
    B:"Motor Uses Hang Cost"=true
}


hud {
    B:"Move Toughness Bar To Armor Side"=true
}


##########################################################################################################
# jumping
#--------------------------------------------------------------------------------------------------------#
# Configure jumping stamina consumption
##########################################################################################################

jumping {
    # Does jumping consume stamina?
    B:"Enable Jump Stamina Cost"=true

    # Feather cost (in half-feathers) per jump
    # Min: 1
    # Max: 2147483647
    I:"Jump Feather Cost"=1

    # Minimum feathers required to jump. If below this, jump will be blocked/reduced.
    # Min: 0
    # Max: 2147483647
    I:"Jump Threshold"=1
}


##########################################################################################################
# ledge climbing
#--------------------------------------------------------------------------------------------------------#
# Configure ledge climbing stamina consumption
##########################################################################################################

"ledge climbing" {
    # Should players be able to grab and climb up ledges?
    B:"Enable Ledge Climbing"=true

    # Stamina cost (in half-feathers) per ledge climb
    # Min: 0
    # Max: 2147483647
    I:"Ledge Climb Cost"=3
}


##########################################################################################################
# mining
#--------------------------------------------------------------------------------------------------------#
# Configure mining/block breaking stamina consumption
##########################################################################################################

mining {
    # Stamina cost (in half-feathers) for breaking any other block
    # Min: 0
    # Max: 2147483647
    I:"Default Block Break Cost"=1

    # Does breaking blocks consume stamina?
    B:"Enable Mining Stamina Cost"=true

    # Number of regular feathers (in half-feathers, e.g. 4 = 2 full feathers) at or below which Mining Fatigue III is applied
    # Min: 0
    # Max: 2147483647
    I:"Mining Fatigue Feather Threshold"=4

    # Stamina cost (in half-feathers) for breaking ores and obsidian
    # Min: 0
    # Max: 2147483647
    I:"Ore/Obsidian Break Cost"=2
}


