##########################################################################################################
# reskillable integration
#--------------------------------------------------------------------------------------------------------#
# Configure Reskillable integration settings
##########################################################################################################

"reskillable integration" {
    # Registry ID of the Armor Mastery perk (defaults to aqtweaks:armor_mastery)
    S:"Armor Mastery Perk ID"=aqtweaks:armor_mastery

    # Stamina weight cost reduction (in half-feathers) per piece of armor worn
    # Min: 0.0
    # Max: 10.0
    D:"Armor Mastery Reduction"=1.0

    # Should we enable integration with custom Reskillable perks?
    B:"Enable Reskillable Perks"=true

    # Registry ID of the Mining Efficiency perk (defaults to aqtweaks:mining_efficiency)
    S:"Mining Efficiency Perk ID"=aqtweaks:mining_efficiency

    # Stamina cost reduction (in half-feathers) applied to mining actions
    # Min: 0
    # Max: 20
    I:"Mining Efficiency Reduction"=1
}


