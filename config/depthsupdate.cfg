# Configuration file

general {
    # Min: 0.25
    # Max: 2.0
    D:"Cheese Caves Size"=1.0

    # The registry name of the block to use as 'Deepslate'.
    S:"Deepslate Block"=depthsupdate:deepslate

    # Min: -256
    # Max: 512
    I:"Deepslate Max Y"=0

    # The number of blocks over which stone transitions into Deepslate.
    # Min: 0
    # Max: 64
    I:"Deepslate Transition Range"=8
    B:"Enable Modded Deepslate Ore Variants"=false
    B:"Generate Cave Entrances"=true
    B:"Generate Cave Pillars"=true
    B:"Generate Cheese Caves"=false
    B:"Generate Noodle Caves"=true
    B:"Generate Spaghetti Caves"=false
    B:"Generate Underground Rivers"=false

    ##########################################################################################################
    # debug
    #--------------------------------------------------------------------------------------------------------#
    # Debug Settings
    ##########################################################################################################

    debug {
        S:"Cheese Cave Debug Block"=minecraft:sponge

        # Outlines cave and river borders with distinctive blocks.
        B:"Enable Debug Visualizer"=false

        # Min: 1
        # Max: 4096
        I:"Generation Log Interval"=64

        # Log the coordinates of each lush cave, dripstone cave and amethyst geode as it is placed.
        B:"Log Feature Placements"=false
        B:"Log Generation"=false
        S:"River Debug Block"=minecraft:glowstone
        S:"Spaghetti Cave Debug Block"=minecraft:glass
    }

    ##########################################################################################################
    # height extension
    #--------------------------------------------------------------------------------------------------------#
    # Settings for extended world height.
    ##########################################################################################################

    "height extension" {
        B:"Convert Old Worlds"=true

        # Per-dimension height overrides.
        # Format: "dimId:minY:maxY" or "dimId:minY:maxY:lavaLevel:voidDamageLevel"
        # Example: "-1:-64:256" extends the Nether to -64..256.
        # Example: "0:-64:320:-54:-128" sets custom lava/void levels for the Overworld.
        # Overrides globalMinY/globalMaxY (and optionally lava/void levels) for the specified dimension.
        S:"Dimension Overrides" <
         >
        B:"Extend Custom World Types"=true

        # Dimension IDs to apply height extension to. Default: [0].
        I:"Extended Dimensions" <
            0
         >

        # The maximum Y coordinate.
        # Min: 256
        # Max: 512
        I:"Global Maximum Y"=320

        # The minimum Y coordinate.
        # Min: -256
        # Max: 0
        I:"Global Minimum Y"=-64

        # The Y level at which underground air is replaced with lava.
        # Min: -256
        # Max: 512
        I:"Lava Level"=-60

        # The sea level Y coordinate.
        # Min: -256
        # Max: 512
        I:"Sea Level"=63

        # The Y level at which players start taking void damage.
        # Min: -512
        # Max: 64
        I:"Void Damage Level"=-128
    }

    ##########################################################################################################
    # registry
    #--------------------------------------------------------------------------------------------------------#
    # Registry Toggles for blocks and items.
