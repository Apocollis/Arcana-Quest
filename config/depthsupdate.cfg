# Configuration file

general {
    # The registry name of the block to use as 'Deepslate'.
    S:"Deepslate Block"=depthsupdate:deepslate
    I:"Deepslate Max Y"=0

    # The number of blocks over which stone transitions into Deepslate.
    I:"Deepslate Transition Range"=8

    # Generate deepslate variants for modded ores defined in
    # config/depthsupdate/deepslate_ores/*.json (one JSON array per file).
    # When the ore would generate below Y=0, it is replaced with the variant block.
    B:"Enable Modded Deepslate Ore Variants"=false
    B:"Generate Cheese Caves"=false
    B:"Generate Spaghetti Caves"=false
    B:"Generate Underground Rivers"=false

    ##########################################################################################################
    # debug
    #--------------------------------------------------------------------------------------------------------#
    # Debug Settings
    ##########################################################################################################

    debug {
        S:"Cheese Cave Debug Block"=minecraft:sponge

        # Outlines cave and river borders with distinctive blocks.
        B:"Enable Debug Visualizer"=false
        S:"River Debug Block"=minecraft:glowstone
        S:"Spaghetti Cave Debug Block"=minecraft:glass
    }

    ##########################################################################################################
    # height extension
    #--------------------------------------------------------------------------------------------------------#
    # Settings for extended world height.
    ##########################################################################################################

    "height extension" {
        # When loading chunks from a non-extended world, fill below Y=0 with stone.
        B:"Convert Old Worlds"=true

        # Per-dimension height overrides.
        # Format: "dimId:minY:maxY" or "dimId:minY:maxY:lavaLevel:voidDamageLevel"
        # Example: "-1:-64:256" extends the Nether to -64..256.
        # Example: "0:-64:320:-54:-128" sets custom lava/void levels for the Overworld.
        # Overrides globalMinY/globalMaxY (and optionally lava/void levels) for the specified dimension.
        S:"Dimension Overrides" <
         >

        # Apply deep terrain fill (bedrock, deepslate, stone) below Y=0 for non-vanilla chunk generators (e.g. Biomes O' Plenty, RTG).
        B:"Extend Custom World Types"=true

        # Dimension IDs to apply height extension to. Default: [0] (Overworld only).
        I:"Extended Dimensions" <
            0
         >

        # The maximum Y coordinate for extended dimensions. Must be a multiple of 16.
        # Min: 256
        # Max: 2048
        I:"Global Maximum Y"=320

        # The minimum Y coordinate for extended dimensions. Must be a multiple of 16.
        # Min: -2048
        # Max: 0
        I:"Global Minimum Y"=-64

        # The Y level at which underground air is replaced with lava.
        I:"Lava Level"=-60

        # The sea level Y coordinate. Used by terrain generation and API queries.
        I:"Sea Level"=63

        # The Y level at which players start taking void damage.
        I:"Void Damage Level"=-128
    }

    ##########################################################################################################
    # registry
    #--------------------------------------------------------------------------------------------------------#
    # Registry Toggles for blocks and items.
    ##########################################################################################################

    registry {
        # Enables Amethyst Blocks and Budding Amethyst.
        B:"Enable Amethyst"=false

        # Enables Azalea, Flowering Azalea, Leaves, and Hanging Roots.
        B:"Enable Azalea"=true
        B:"Enable Calcite"=true
        B:"Enable Cave Vines and Glow Berries"=true

        # Enables Deepslate, Cobbled Deepslate, Bricks, Tiles, Stairs, Walls, Slabs, and Infested Deepslate.
        B:"Enable Deepslate"=true

        # Enables Small Dripleaf, Big Dripleaf, and Stems.
        B:"Enable Dripleaf"=true
        B:"Enable Dripstone Block"=true

        # Enables Moss Blocks and Moss Carpets.
        B:"Enable Moss"=true

        # Enables Raw Iron, Raw Gold, and Raw Copper blocks.
        B:"Enable Raw Ore Blocks"=false
        B:"Enable Rooted Dirt"=true
        B:"Enable Smooth Basalt"=true
        B:"Enable Spore Blossom"=true
        B:"Enable Spyglass"=true
        B:"Enable Tuff"=false
    }

    ##########################################################################################################
    # lush caves
    #--------------------------------------------------------------------------------------------------------#
    # Settings related to the Lush Caves biome.
    ##########################################################################################################

    "lush caves" {
        # Allow Lush Caves to generate underground.
        B:"Enable Lush Caves"=true

        # Min: 1
        # Max: 100
        I:"Height Base Size"=16

        # Min: 0
        # Max: 100
        I:"Height Variation"=6

        # The rarity of Lush Caves. Higher numbers mean rarer caves. (1 in X chance per chunk)
        # Min: 1
        # Max: 1000
        I:"Lush Caves Rarity"=12
        I:"Maximum Height"=63
        I:"Minimum Height"=-64

        # Min: 1
        # Max: 100
        I:"Radius Base Size"=16

        # Min: 0
        # Max: 100
        I:"Radius Variation"=8
    }

    ##########################################################################################################
    # dripstone caves
    #--------------------------------------------------------------------------------------------------------#
    # Settings related to the Dripstone Caves biome.
    ##########################################################################################################

    "dripstone caves" {
        # The rarity of Dripstone Caves. Higher numbers mean rarer caves. (1 in X chance per chunk)
        # Min: 1
        # Max: 1000
        I:"Dripstone Caves Rarity"=100

        # Allow Dripstone Caves to generate underground.
        B:"Enable Dripstone Caves"=true

        # Min: 1
        # Max: 100
        I:"Height Base Size"=16

        # Min: 0
        # Max: 100
        I:"Height Variation"=8
        I:"Maximum Height"=63
        I:"Minimum Height"=-64

        # Min: 1
        # Max: 100
        I:"Radius Base Size"=20

        # Min: 0
        # Max: 100
        I:"Radius Variation"=10
    }

    "amethyst geodes" {
        B:"Enable Amethyst Geodes"=true

        # The rarity of Amethyst Geodes. Higher numbers mean rarer geodes. (1 in X chance per chunk)
        # Min: 1
        # Max: 1000
        I:"Geode Rarity"=24
        I:"Maximum Height"=30
        I:"Minimum Height"=-58
    }

    aquifers {
        B:"Enable Aquifers"=false
    }

}


