# Configuration file

general {
    # Add spawns for where the Ancient Guilder can spawn if Better End is installed, these weights are decreased compared to default spawning in the regular End Biome
    S:"Ancient Guilder Allowed Biome Spawns BE" <
        betterendforge:neon_oasis
        betterendforge:dry_shrubland
        betterendforge:lantern_woods
     >

    # Add spawns for where the Ashed Parasite can spawn if Better End is installed, these weights are decreased compared to default spawning in the Ash Wastelands
    S:"Ashed Parasite Allowed Biome Spawns BE" <
        betterendforge:shadow_forest
        betterendforge:dragon_graveyards
        betterendforge:chorus_forest
     >

    # If Better End Forge Backport is installed, End Expansion add mob spawns in Better End's Biomes. NOTE that the sky box from End Expansion will automatically be disabled with Better End installed
    B:"Better End Support"=true

    # Add spawns for where the Depths Chomper can spawn if Better End is installed, these weights are decreased compared to default spawning in the Ash Wastelands. They will only spawn underground
    S:"Depths Chomper Allowed Biome Spawns BE" <
        betterendforge:shadow_forest
     >

    # Add spawns for where the End Stalker can spawn if Better End is installed, these weights are decreased compared to default spawning in the Ash Wastelands
    S:"End Stalker Allowed Biome Spawns BE" <
        betterendforge:shadow_forest
     >

    # Add spawns for where the Lidoped can spawn if Better End is installed, these weights are decreased compared to default spawning in the Barrend Bogs
    S:"Lidoped Allowed Biome Spawns BE" <
        betterendforge:amber_land
        betterendforge:chorus_forest
        betterendforge:lantern_woods
     >

    # If Unseens Dungeon Additions is loaded in, End Expansion will higher its difficulty to accommodate for the gear that UDA has to offer. Basically default stats will go up for everything, mobs, weapons, armor. default : true
    B:"UDA Compat Support"=true
}


