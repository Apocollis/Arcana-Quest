# Configuration file

general {

    ##########################################################################################################
    # stamina module
    #--------------------------------------------------------------------------------------------------------#
    # Configure the Stamina Module settings
    ##########################################################################################################

    "stamina module" {

        ##########################################################################################################
        # jumping
        #--------------------------------------------------------------------------------------------------------#
        # Configure jumping stamina consumption
        ##########################################################################################################

        jumping {
            # Does jumping consume stamina?
            B:"Enable Jump Stamina Cost"=true

            # Feather cost (in half-feathers) per jump
            # Min: 1
            # Max: 2147483647
            I:"Jump Feather Cost"=1

            # Minimum feathers required to jump. If below this, jump will be blocked/reduced.
            # Min: 0
            # Max: 2147483647
            I:"Jump Threshold"=1
        }

        ##########################################################################################################
        # bow drawing
        #--------------------------------------------------------------------------------------------------------#
        # Configure bow-drawing stamina consumption
        ##########################################################################################################

        "bow drawing" {
            # Stamina cost (in half-feathers) charged instantly upon drawing a bow
            # Min: 0
            # Max: 2147483647
            I:"Bow Draw Cost"=2

            # Stamina cost (in half-feathers) consumed per hold interval
            # Min: 0
            # Max: 2147483647
            I:"Bow Hold Cost"=1

            # Ticks between feather consumption while holding a bow fully drawn (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Bow Hold Tick Interval"=20

            # Does drawing and holding a bow consume stamina?
            B:"Enable Bow Stamina Cost"=true
        }

        ##########################################################################################################
        # climbing
        #--------------------------------------------------------------------------------------------------------#
        # Configure ladder, vine, and rope climbing stamina consumption
        ##########################################################################################################

        climbing {
            # Does climbing/clinging to ladders/vines consume stamina?
            B:"Enable Climbing Stamina Cost"=true

            # Does climbing/clinging to ropes consume stamina?
            B:"Enable Rope Climb Cost"=true

            # If true, the player will lose their grip and fall/slide when out of stamina.
            B:"Fall on Stamina Depleted"=true

            # Stamina cost (in half-feathers) per interval on ladders
            # Min: 0
            # Max: 2147483647
            I:"Ladder Climb Cost"=2

            # Ticks between feather consumption on ladders (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Ladder Climb Tick Interval"=20

            # Stamina cost (in half-feathers) per interval on ropes
            # Min: 0
            # Max: 2147483647
            I:"Rope Climb Cost"=3

            # Ticks between feather consumption on ropes (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Rope Climb Tick Interval"=20

            # Stamina cost (in half-feathers) per interval on vines
            # Min: 0
            # Max: 2147483647
            I:"Vine Climb Cost"=3

            # Ticks between feather consumption on vines (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Vine Climb Tick Interval"=20
        }

        ##########################################################################################################
        # weapons (melee)
        #--------------------------------------------------------------------------------------------------------#
        # Configure melee weapon stamina consumption
        ##########################################################################################################

        "weapons (melee)" {
            # Does attacking with melee weapons consume stamina?
            B:"Enable Melee Attack Cost"=true

            # Feather cost (in half-feathers) for heavy weapons
            # Min: 0
            # Max: 2147483647
            I:"Heavy Weapons Cost"=3

            # List of registry names of custom items to treat as heavy weapons
            S:"Heavy Weapons Custom List" <
             >

            # Damage multiplier applied if attacking without enough feathers
            # Min: 0.0
            # Max: 1.0
            D:"Heavy Weapons Damage Multiplier"=0.3

            # Feather cost (in half-feathers) for light weapons
            # Min: 0
            # Max: 2147483647
            I:"Light Weapons Cost"=1

            # List of registry names of custom items to treat as light weapons (e.g. modid:item_id)
            S:"Light Weapons Custom List" <
             >

            # Damage multiplier applied if attacking without enough feathers
            # Min: 0.0
            # Max: 1.0
            D:"Light Weapons Damage Multiplier"=0.8

            # Feather cost (in half-feathers) for medium weapons
            # Min: 0
            # Max: 2147483647
            I:"Medium Weapons Cost"=2

            # List of registry names of custom items to treat as medium weapons
            S:"Medium Weapons Custom List" <
             >

            # Damage multiplier applied if attacking without enough feathers
            # Min: 0.0
            # Max: 1.0
            D:"Medium Weapons Damage Multiplier"=0.5
        }

        ##########################################################################################################
        # grapple mod
        #--------------------------------------------------------------------------------------------------------#
        # Configure grappling hook stamina consumption
        ##########################################################################################################

        "grapple mod" {
            # Does active grappling consume stamina?
            B:"Enable Grapple Stamina Cost"=true

            # Stamina cost (in half-feathers) consumed per hold interval
            # Min: 0
            # Max: 2147483647
            I:"Grapple Hold Cost"=1

            # Ticks between feather consumption while grappling (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Grapple Hold Tick Interval"=20
        }

        ##########################################################################################################
        # open glider
        #--------------------------------------------------------------------------------------------------------#
        # Configure hang glider stamina consumption
        ##########################################################################################################

        "open glider" {
            # Does gliding with a hang glider consume stamina?
            B:"Enable Glider Stamina Cost"=true

            # Stamina cost (in half-feathers) consumed per glide interval
            # Min: 0
            # Max: 2147483647
            I:"Glider Glide Cost"=1

            # Ticks between feather consumption while gliding (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Glider Glide Tick Interval"=20
        }

        ##########################################################################################################
        # shield blocking
        #--------------------------------------------------------------------------------------------------------#
        # Configure shield stamina consumption
        ##########################################################################################################

        "shield blocking" {
            # Does raising and holding a shield consume stamina?
            B:"Enable Shield Stamina Cost"=true

            # Stamina cost (in half-feathers) consumed per hold interval
            # Min: 0
            # Max: 2147483647
            I:"Shield Hold Cost"=1

            # Ticks between feather consumption while holding a shield raised (20 ticks = 1 second)
            # Min: 1
            # Max: 2147483647
            I:"Shield Hold Tick Interval"=20

            # Stamina cost (in half-feathers) charged instantly upon raising a shield
            # Min: 0
            # Max: 2147483647
            I:"Shield Raise Cost"=2
        }

        ##########################################################################################################
        # mining
        #--------------------------------------------------------------------------------------------------------#
        # Configure mining/block breaking stamina consumption
        ##########################################################################################################

        mining {
            # Stamina cost (in half-feathers) for breaking any other block
            # Min: 0
            # Max: 2147483647
            I:"Default Block Break Cost"=1

            # Does breaking blocks consume stamina?
            B:"Enable Mining Stamina Cost"=true

            # Number of regular feathers (in half-feathers, e.g. 4 = 2 full feathers) at or below which Mining Fatigue III is applied
            # Min: 0
            # Max: 2147483647
            I:"Mining Fatigue Feather Threshold"=4

            # Stamina cost (in half-feathers) for breaking ores and obsidian
            # Min: 0
            # Max: 2147483647
            I:"Ore/Obsidian Break Cost"=2
        }

        ##########################################################################################################
        # reskillable integration
        #--------------------------------------------------------------------------------------------------------#
        # Configure Reskillable integration settings
        ##########################################################################################################

        "reskillable integration" {
            # Registry ID of the Armor Mastery perk (defaults to aqtweaks:armor_mastery)
            S:"Armor Mastery Perk ID"=aqtweaks:armor_mastery

            # Stamina weight cost reduction (in half-feathers) per piece of armor worn
            # Min: 0.0
            # Max: 10.0
            D:"Armor Mastery Reduction"=1.0

            # Should we enable integration with custom Reskillable perks?
            B:"Enable Reskillable Perks"=true

            # Registry ID of the Mining Efficiency perk (defaults to aqtweaks:mining_efficiency)
            S:"Mining Efficiency Perk ID"=aqtweaks:mining_efficiency

            # Stamina cost reduction (in half-feathers) applied to mining actions
            # Min: 0
            # Max: 20
            I:"Mining Efficiency Reduction"=1
        }

        ##########################################################################################################
        # simple difficulty integration
        #--------------------------------------------------------------------------------------------------------#
        # Configure Simple Difficulty integration settings
        ##########################################################################################################

        "simple difficulty integration" {
            # Should restoring feathers consume Simple Difficulty hydration?
            B:"Enable Thirst Cost"=true

            # Thirst exhaustion added per half-feather regenerated (4.0 exhaustion consumes 1 point of thirst saturation/level)
            # Min: 0.0
            # Max: 4.0
            D:"Thirst Exhaustion Per Feather"=0.25
        }

        ##########################################################################################################
        # ledge climbing
        #--------------------------------------------------------------------------------------------------------#
        # Configure ledge climbing stamina consumption
        ##########################################################################################################

        "ledge climbing" {
            # Should players be able to grab and climb up ledges?
            B:"Enable Ledge Climbing"=true

            # Stamina cost (in half-feathers) per ledge climb
            # Min: 0
            # Max: 2147483647
            I:"Ledge Climb Cost"=4
        }

    }

    ##########################################################################################################
    # grimoire of gaia module
    #--------------------------------------------------------------------------------------------------------#
    # Configure the Grimoire of Gaia Module settings
    ##########################################################################################################

    "grimoire of gaia module" {
        # Should piercing/penetrating damage from Grimoire of Gaia mobs be converted to normal damage that is reducible by physical armor?
        B:"Disable Piercing Damage"=true
    }

    ##########################################################################################################
    # thaumcraft module
    #--------------------------------------------------------------------------------------------------------#
    # Configure Thaumcraft integration settings
    ##########################################################################################################

    "thaumcraft module" {
        # Should normal (sticky) warp be reduced on successful sleep?
        B:"Clear Normal Warp"=true

        # Should temporary warp be reduced on successful sleep?
        B:"Clear Temporary Warp"=true

        # The text of the message sent to players when they gain warp from entering a new dimension
        S:"Dimension Chat Message Text"=§5Entering this strange dimension fills your mind with ancient whispers...§r

        # Amount of normal (sticky) warp gained when entering a new dimension for the first time
        # Min: 0
        # Max: 2147483647
        I:"Dimension Entry Normal Warp"=5

        # The sound registry name to play when the player gains warp from entering a new dimension. Leave empty to play no sound.
        S:"Dimension Entry Sound"=thaumcraft:whispers

        # The volume of the sound played when entering a new dimension. Higher values increase sound reach and loudness.
        # Min: 0.0
        # Max: 10.0
        D:"Dimension Entry Sound Volume"=2.0

        # Amount of temporary warp gained when entering a new dimension for the first time
        # Min: 0
        # Max: 2147483647
        I:"Dimension Entry Temporary Warp"=5

        # Seconds of dungeon exposure required to gain 1 point of temporary warp.
        # Min: 1
        # Max: 2147483647
        I:"Dungeon Exposure Interval"=180

        # Should players slowly accumulate temporary warp while deep underground?
        B:"Enable Deep Underground Exposure"=true

        # Should players gain warp when entering a new dimension for the first time?
        B:"Enable Dimension Entry Warp"=true

        # Should players slowly accumulate temporary warp while inside a Roguelike Dungeon?
        B:"Enable Dungeon Exposure"=true
        B:"Enable Exposure Chat Warning"=true

        # Should a sound effect play when temporary warp is gained from environmental exposure?
        B:"Enable Exposure Sound"=true

        # Should players receive a chat message informing them that their mind feels clearer upon waking up?
        B:"Enable Sleep Chat Message"=true

        # Should sleeping in a bed clear a small amount of Thaumcraft warp?
        B:"Enable Sleep Warp Cleansing"=true

        # Should players slowly accumulate temporary warp over time when exposed to certain environments?
        B:"Enable Warp Exposure"=true

        # List of dimensions where the player slowly accumulates temporary warp, with their exposure intervals.
        # Format: dimension_id=interval_seconds
        # Example: -1=300 (Nether accumulates 1 warp every 5 minutes)
        # Example: 1=180 (The End accumulates 1 warp every 3 minutes)
        S:"Exposure Dimensions Config" <
            -1=300
            1=180
         >

        # The sound registry name to play when temporary warp is gained from environmental exposure. Default: thaumcraft:whispers
        S:"Exposure Sound Effect"=thaumcraft:whispers

        # The volume of the sound played when temporary warp is gained from environmental exposure. Higher values increase sound reach and loudness.
        # Min: 0.0
        # Max: 10.0
        D:"Exposure Sound Volume"=2.0

        # Amount of normal (sticky) warp to clear per successful sleep
        # Min: 0
        # Max: 2147483647
        I:"Normal Warp Reduction"=1

        # The text of the message sent to players when their warp is reduced by sleeping
        S:"Sleep Chat Message Text"=§5You wake up feeling refreshed, and the whispers in your mind grow quieter...§r

        # Amount of temporary warp to clear per successful sleep
        # Min: 0
        # Max: 2147483647
        I:"Temporary Warp Reduction"=2

        # Seconds of underground exposure required to gain 1 point of temporary warp.
        # Min: 1
        # Max: 2147483647
        I:"Underground Exposure Interval"=300

        # Y level at or below which the player accumulates temporary warp.
        # Min: -1
        # Max: 256
        I:"Underground Y Threshold"=30
    }

    ##########################################################################################################
    # bewitchment module
    #--------------------------------------------------------------------------------------------------------#
    # Configure Bewitchment integration settings
    ##########################################################################################################

    "bewitchment module" {
        # List of Bewitchment ritual registry names that should grant Thaumcraft warp upon completion.
        # Format: registry_name=normal,temporary,permanent (permanent is optional and defaults to 0)
        S:"Ritual Warp List" <
            bewitchment:conjure_imp=1,3
            bewitchment:conjure_demon=2,5
            bewitchment:conjure_baphomet=5,15,2
            bewitchment:conjure_leonard=5,15,2
            bewitchment:lesser_hellmouth=2,5
            bewitchment:hellmouth=3,8
            bewitchment:greater_hellmouth=4,10
            bewitchment:sowing_salt=2,4
            bewitchment:drought=2,4
            bewitchment:hungry_flames=2,4
            bewitchment:conjure_wither=3,6
         >
    }

    ##########################################################################################################
    # roguelike dungeons module
    #--------------------------------------------------------------------------------------------------------#
    # Configure Roguelike Dungeons structure integration settings
    ##########################################################################################################

    "roguelike dungeons module" {
        # The radius (in blocks) from the center chunk that defines the dungeon structure boundary.
        # Min: 8
        # Max: 2147483647
        I:"Dungeon Radius"=48

        # Should Roguelike Dungeons be forced to spawn on a predictable mathematical grid instead of randomly?
        B:"Enable Grid Spawning"=true

        # Seed salt value to ensure different worlds spawn dungeons in different grid coordinates.
        I:"Grid Seed Offset"=1432289

        # The maximum chunk distance between Roguelike Dungeon spawns. MUST be larger than Minimum Chunk Distance.
        # Min: 2
        # Max: 2147483647
        I:"Maximum Chunk Distance"=48

        # The minimum chunk distance between Roguelike Dungeon spawns.
        # Min: 1
        # Max: 2147483647
        I:"Minimum Chunk Distance"=32
    }

    ##########################################################################################################
    # depths module
    #--------------------------------------------------------------------------------------------------------#
    # Configure Depths Update (-Y levels) compatibility settings
    ##########################################################################################################

    "depths module" {
        # Should YUNG's Better Caves bedrock generation layer be shifted down to Minimum World Y?
        B:"Adjust Better Caves Bedrock Height"=true

        # Should YUNG's Better Caves carve caves and caverns down to Minimum World Y?
        B:"Enable Better Caves Negative Y"=true

        # Should CoFH World features evaluate and place blocks below Y = 0 down to Minimum World Y?
        B:"Enable CoFH World Negative Y"=true

        # Should negative Y-level compatibility enhancements be enabled for Depths Update?
        B:"Enable Depths Module"=true

        # Should RTG terrain around villages be smoothed and leveled out to prevent steep cliffs and floating/buried buildings?
        B:"Enable RTG Village Terrain Smoothing"=true

        # Should Recurrent Complex Volts placement rays scan below Y = 0 down to Minimum World Y?
        B:"Enable Recurrent Complex Negative Y"=true

        # If true, Roguelike Dungeons will always force 10 floors for testing. If false, dungeons generate strictly the number of levels defined in their JSON theme settings.
        B:"Force 10 Dungeon Levels For Testing"=false

        # The minimum Y coordinate boundary of the world (defaults to -64 for Depths Update).
        # Min: -256
        # Max: 0
        I:"Minimum World Y Elevation"=-64

        # Maximum number of levels for Roguelike Dungeons to generate (levels 5+ extend below Y = 0 into deepslate).
        # Min: 5
        # Max: 10
        I:"Roguelike Dungeons Maximum Levels"=10
    }

}


