# Configuration file

dimensions {
    # Dimension ids the mod applies to. Empty list with blacklist mode = all dimensions.
    I:list <
     >

    # true: the list is a whitelist. false: the list is a blacklist.
    B:whitelist=false
}


light {
    # Defer the per-tick sky light retry (Chunk.onTick -> checkLight) for chunks away from players and
    # outside their travel direction while chunk generation is heavy. A deferred chunk is not sent to clients
    # until its light pass runs.
    B:deferEnabled=false

    # Time budget for deferred light passes per tick, in ms.
    # Min: 0.1
    # Max: 20.0
    D:drainBudgetMs=2.0

    # At most this many deferred light passes per tick.
    # Min: 1
    # Max: 256
    I:drainPerTick=8

    # Generation counts as heavy when chunk provision averages at least this many ms per tick.
    # Min: 0.0
    # Max: 50.0
    D:heavyGenMs=5.0

    # Cap on queued light passes; past it chunks are lit at once.
    # Min: 16
    # Max: 65536
    I:maxQueued=4096

    # Chunks within this many chunks of a player are never deferred.
    # Min: 0
    # Max: 8
    I:protectRadius=2
}


logging {
    # TEMPORARY diagnostics, verbose: every second, why chunk provision calls were passed, bypassed,
    # admitted or deferred and what the populate gate did, plus a scan of the chunks around each player
    # (missing, loaded but unpopulated, and why). Every line starts with 'dbg': grep dbg latest.log.
    B:debug=false

    # Log a status summary every this many seconds. 0 disables.
    # Stage and world generator timing is only collected while this is above 0.
    # Min: 0
    # Max: 3600
    I:statusIntervalSeconds=5

    # Number of slowest world generators (IWorldGenerator classes) listed in the status log.
    # Min: 0
    # Max: 50
    I:topGenerators=8
}


movement {
    # Player movement (speed, direction, standing still) is measured from the position change over this many
    # ticks (20 = 1 s) instead of every tick. Cheaper to run; the emergency radius, chunk order and the idle
    # preload tier react up to this long after a change. 1 = every tick.
    # Min: 1
    # Max: 40
    I:sampleTicks=10
}


ordering {
    # How much more a chunk directly behind the player costs than one straight ahead at the same distance.
    # 1.0 = behind counts as twice as far. 0 = vanilla order exactly.
    # Min: 0.0
    # Max: 8.0
    D:directionPenalty=1.0

    # Order missing chunks by distance and by angle from the player's direction instead of distance only.
    B:enabled=true
    I:nearRadius=3

    # Re-sort the missing chunks when a player's direction turns by more than this many degrees. 0 = never.
    # Min: 0.0
    # Max: 180.0
    D:resortAngleDegrees=30.0

    # At or above this speed (blocks per tick) the travel direction is used; in between the two are blended.
    # Min: 0.01
    # Max: 10.0
    D:velocityFullSpeed=0.8

    # Below this speed (blocks per tick) the view direction is used.
    # Min: 0.0
    # Max: 10.0
    D:velocityMinSpeed=0.35
}


populate {
    # A chunk generated while another chunk is populating (a cascade: a generator read or wrote past
    # the loaded area) is generated terrain only and populated later through the queue, instead of inside the
    # running populate. Ore and structure placement still sees real terrain.
    B:cascadeDeferral=true

    # Ticks a cascade-generated chunk stays loaded before it is released if no player owns it.
    # Min: 20
    # Max: 6000
    I:cascadeHoldTicks=200

    # At most this many queued populates are run per tick (within the tick budget).
    # Min: 1
    # Max: 64
    I:drainPerTick=3

    # Spread chunk populate (trees, ores, structures, every mod's world generators) across ticks.
    # A populate that would push the current tick past tickBudgetMs is queued and run later; chunks are not
    # sent to players until populated, so queued chunks only arrive later. Nothing is cancelled.
    B:enabled=true
    I:fastFullRadius=4
    D:fastSpeed=0.8
    B:fastTerrainOnly=true

    # Cap on queued populates; past it chunks populate at once.
    # Min: 16
    # Max: 65536
    I:maxQueued=4096

    # Guarantee at least one populate every this many ticks, even on a busy server.
    # Min: 1
    # Max: 200
    I:maxStarveTicks=4

    # Chunks within this many chunks of a player (or the speed-scaled emergency radius) populate at once.
    # Min: 0
    # Max: 8
    I:protectRadius=2

    # A populate may start only while the current tick has used less than this many ms.
    # Min: 5.0
    # Max: 50.0
    D:tickBudgetMs=30.0

    # Mod ids whose Forge chunk tickets exempt a chunk from populate deferral: a chunk held by a ticket
    # owned by one of these mods populates immediately (and is taken out of the populate queue), never later.
    # For mods that load chunks across ticks and then call populate themselves, such as Roguelike Dungeons
    # (roguelike): a deferred populate would run after the mod built on the chunk and could overwrite it.
    # Cascades are never exempt. Empty list = off.
    S:ticketExemptMods <
        roguelike
     >
}


preload {
    # Preload holds off while this many chunks (not counting preload's own) were generated in the last
    # busyWindowTicks ticks: the server is busy generating chunks players need.
    # Min: 1
    # Max: 1000
    I:busyChunks=6

    # Mod ids whose Forge chunk tickets mark generation as the mod's own work, not player demand: a chunk
    # generated while held by a ticket owned by one of these mods does not count toward busyChunks, so preload,
    # stage 2 and ChunkStewardAPI.isGeneratingChunks() do not report it. For mods that force their footprint
    # chunks on a ticket right before loading them and pace themselves on isGeneratingChunks(), such as
    # Roguelike Dungeons (roguelike), which otherwise paused its own build. Empty list = count everything.
    S:busyIgnoreMods <
        roguelike
     >

    # Window for busyChunks, in ticks (100 = 5 s, at most 250).
    # Min: 1
    # Max: 250
    I:busyWindowTicks=100

    # Generate chunks beyond the view distance around players while the server has spare time.
    B:enabled=true

    # Ticks a fully preloaded chunk stays loaded so its neighbours can populate it, then it is released.
    # Min: 20
    # Max: 6000
    I:holdTicks=200

    # Idle tier: full generation (terrain and populate) this many chunks past the view distance.
    # Min: 0
    # Max: 32
    I:idleExtraFull=2

    # Idle tier: terrain-only generation (no populate) this many chunks past the view distance. 0 = off.
    # Min: 0
    # Max: 48
    I:idleExtraTerrain=12

    # Players standing still for this many ticks (20 = 1 s) get the idle tier: full generation out to
    # view distance + idleExtraFull, terrain only out to view distance + idleExtraTerrain.
    # Min: 1
    # Max: 1200
    I:idleStillTicks=20

    # At most one chunk is generated every this many ticks.
    # Min: 1
    # Max: 200
    I:intervalTicks=2

    # Safety cap on chunks held loaded by preload and cascades together.
    # Min: 16
    # Max: 4096
    I:maxHeldChunks=600

    # At most this many chunks are preloaded per player per minute.
    # Min: 1
    # Max: 6000
    I:maxPerMinute=90

    # Preload holds off while this many populates are queued.
    # Min: 0
    # Max: 4096
    I:maxPopulateBacklog=4

    # Idle tier runs only when the average tick and the current tick are both under this many ms.
    # Min: 1.0
    # Max: 50.0
    D:maxTickMs=20.0

    # Moving tier: slow players (walking, sprinting) get a terrain-only cone ahead of them. False keeps
    # preload to standing-still players only.
    B:movingEnabled=true

    # Moving tier: terrain-only generation this many chunks past the view distance, ahead of the player.
    # Min: 1
    # Max: 16
    I:movingExtraTerrain=3

    # Moving tier: half-angle of the forward cone, in degrees.
    # Min: 10.0
    # Max: 180.0
    D:movingForwardAngleDegrees=60.0

    # Moving tier is off above this speed (blocks per tick). Sprinting is about 0.28, elytra well above 0.5.
    # Min: 0.0
    # Max: 10.0
    D:movingMaxSpeed=0.3

    # Moving tier runs only when the average tick and the current tick are both under this many ms.
    # Min: 1.0
    # Max: 50.0
    D:movingMaxTickMs=15.0
    I:radius=10
    I:stationaryTicks=40
    I:terrainOnlyMaxChunks=600
    I:terrainOnlyRadius=20
}


randomticks {
    # While the world runs its random block ticks (lava and fire spread, grass spread), a read or write
    # in a chunk that is not loaded sees an empty chunk instead of generating it. Nothing is lost: the spread
    # simply does not cross into unloaded terrain, as in newer Minecraft versions.
    B:guardEnabled=true
}


stage2 {
    # A hotspot is worked on only while a player is within this many chunks of it.
    # Min: 1
    # Max: 64
    I:activeRadiusChunks=8

    # Dwell cells are this many chunks wide.
    # Min: 1
    # Max: 64
    I:cellSizeChunks=8

    # Horizontal distance from the anchor, in blocks, within which a player counts as staying in place.
    # Min: 4
    # Max: 256
    I:dwellAnchorRadiusBlocks=32

    # Accumulated time (in a 3x3 block of cells) that turns a place into a hotspot, in minutes.
    # Min: 1
    # Max: 1440
    I:dwellMinutes=10

    # Dwell is sampled every this many seconds. A player within dwellAnchorRadiusBlocks of their anchor
    # is idle and credits the sample to their cell; farther away the anchor moves to where they are.
    # Min: 1
    # Max: 300
    I:dwellSampleSeconds=10

    # Home-area pregen. Areas where players spend time (a bed or respawn point, or a place where they
    # stay about dwellMinutes in total) become hotspots. While a player is near one, and the server has spare
    # time, the area is generated terrain-only out to radiusTerrain, then populated out to radiusFull.
    # NOTE: a pregenerated area keeps the worldgen settings of the moment; later worldgen config changes only
    # affect chunks generated after them. Turn this off on worlds where you test worldgen.
    B:enabled=true

    # A player's bed or respawn point becomes a hotspot at once.
    B:homeFromBed=true

    # At most one operation (a generation or a populate) every this many ticks.
    # Min: 1
    # Max: 200
    I:intervalTicks=4

    # At most this many operations per hotspot per minute.
    # Min: 1
    # Max: 6000
    I:maxPerMinute=240

    # Runs only when the average tick and the current tick are both under this many ms.
    # Min: 1.0
    # Max: 50.0
    D:maxTickMs=30.0

    # Hard limit on chunks pregenerated by stage 2 (all dimensions). 0 = no limit.
    # Min: 0
    # Max: 100000000
    I:maxTotalChunks=0

    # A new hotspot within this many chunks of an existing one is merged into it.
    # Min: 1
    # Max: 64
    I:mergeRadiusChunks=8

    # Chunks within this square radius of a hotspot are fully generated and populated.
    # Min: 1
    # Max: 64
    I:radiusFull=20

    # Past radiusFull, terrain only out to this square radius. Must be larger than radiusFull.
    # Min: 2
    # Max: 96
    I:radiusTerrain=30

    # Log a warning (and tell operators) once this many chunks have been pregenerated by stage 2. 0 = off.
    # Min: 0
    # Max: 100000000
    I:warnTotalChunks=100000
}


throttle {
    # While the server holds 20 TPS (measured TPS at tpsFull, or the average tick work of about the last 20
    # ticks under 50 ms), admit every chunk, however long the current tick already is; vanilla still stops
    # after 50 ms per tick. Below 20 TPS, targetTickMs applies. false = only the targetTickMs headroom rule
    # (the behaviour before 0.3's pacing API).
    B:admitAtFullTps=true

    # Fast players get a larger emergency radius: emergencyRadius + ceil(speed * lookaheadTicks / 16),
    # speed in blocks per tick. 0 turns the speed scaling off.
    # Min: 0
    # Max: 200
    I:emergencyLookaheadTicks=20

    # Cap on the speed-scaled emergency radius, in chunks.
    # Min: 0
    # Max: 8
    I:emergencyMaxRadius=5

    # Below this speed (blocks per tick) the emergency radius is not scaled. Sprinting is about 0.28.
    # Min: 0.0
    # Max: 10.0
    D:emergencyMinSpeed=0.3

    # Chunks within this many chunks of a player (0 = only the chunk they stand in) always load immediately.
    # Min: 0
    # Max: 4
    I:emergencyRadius=1

    # Master switch for the adaptive chunk throttle.
    B:enabled=true

    # When the average non-chunk tick work is below this many ms the server is idle and chunks load at full vanilla speed.
    # Min: 0.0
    # Max: 50.0
    D:idleTickMs=15.0
    D:maxBudgetMs=100.0

    # Guarantee at least one generated chunk every this many ticks (4 = 0.2 s), so loading never starves.
    # Min: 1
    # Max: 200
    I:maxStarveTicks=4
    D:minBudgetMs=0.0
    D:rampMsPerSecond=4.0

    # Pause throttled loading on the tick of a world save (autosave every 900 ticks, /save-all) and this many ticks after.
    # Min: 0
    # Max: 20
    I:savePauseTicks=1
    D:startBudgetMs=50.0

    # Target server tick work in ms. Chunk generation only gets the headroom left under this.
    # Min: 5.0
    # Max: 50.0
    D:targetTickMs=40.0

    # Measured TPS (over about the last 5 seconds) at or above which the server counts as having room (load factor 1).
    # Slightly under 20 on purpose: a 100-tick mean of 50.3 ms reads 19.88 TPS, which should still count as full.
    # Reported (status log, /chunksteward status, ChunkStewardAPI.getLoadFactor and isServerBehind) and, with
    # admitAtFullTps, the point from which every chunk is admitted. Measured TPS is min(20, 1000 / average tick work),
    # so any average under 50 ms reads 20.
    # Min: 5.0
    # Max: 20.0
    D:tpsFull=19.5

    # Measured TPS at or below which the server counts as under load (load factor 0). Reported only, see tpsFull.
    # Min: 1.0
    # Max: 19.9
    D:tpsLoaded=15.0

    # Ticks after a player joins during which their chunks load without limits (200 = 10 s).
    # Min: 0
    # Max: 6000
    I:warmupTicks=200
}


