mint_spread {
    # 薄荷局部扩散上限，附近薄荷达到该数量后停止继续扩散
    # Maximum nearby mint blocks before mint stops spreading locally
    I:mintSpreadMaxNearby=16

    # 薄荷单区块扩散上限，区块内达到该数量后停止继续扩散
    # Maximum mint blocks per chunk before mint stops spreading in that chunk
    I:mintSpreadMaxPerChunk=50

    # 薄荷扩散速率，数字越大越慢
    # How fast mint spreads; higher number means slower
    I:mintSpreadRate=6

    # 薄荷是否会随机扩散
    # Should mint spread randomly
    B:shouldMintSpread=true
}


