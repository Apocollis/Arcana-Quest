        misc {
            # Whether players are visually animated when dodging.
            B:"Dodge Animation"=true

            # How many ticks the dodge animation lasts.
            # Min: 1
            # Max: 40
            I:"Dodge Animation Duration"=16

            # Visual strength of the dodge animation.
            # Min: 0.0
            # Max: 2.0
            D:"Dodge Animation Intensity"=1.0

            # Whether the Player's dodge creates a puff of smoke.
            B:"Enable Particles"=true

            # Whether the Player dodge is weaker in the End.
            B:"End Dodge"=false

            # Whether dodges use directional smoke and tuned dodge sounds.
            B:"Enhanced Dodge Effects"=true

            # Feather HUD texture style. Valid values: extended, original, custom.
            S:"Feather HUD Texture Style"=extended

            # Whether dodges tilt the camera in first person.
            B:"First Person Camera Dodge Animation"=true

            # Visual strength of the first person camera dodge animation.
            # Min: 0.0
            # Max: 2.0
            D:"First Person Camera Intensity"=0.8

            # Whether dodges move the held item in first person.
            B:"First Person Dodge Animation"=true

            # Whether the Player dodges further in the Nether.
            B:"Nether Dodge"=false

            # Whether the Player is notified when the Endurance Effect is overpowered by the Heavy Effect.
            B:"Overwhelmed Message"=true
        }

        integration {

            toughasnails {
                # Whether to enable Tough as Nails support
                B:Enabled=true

                # How much exhaustion (thirstiness) is added when the player regenerates a dodge feather.
                # Min: 0.0
                # Max: 40.0
                D:Exhaustion=1.0
            }

            reskillable {
                # Whether dodging requires the Reskillable Dodge trait when Reskillable is installed.
                B:Enabled=true
            }

        }

