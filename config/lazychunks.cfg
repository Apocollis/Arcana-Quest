# Configuration file

dimensions {
    # Dimension ids the mod applies to. Empty list with blacklist mode = all dimensions.
    I:list <
     >

    # true: the list is a whitelist. false: the list is a blacklist.
    B:whitelist=false
}


logging {
    # Log a one-line status summary every this many seconds. 0 disables.
    # Min: 0
    # Max: 3600
    I:statusIntervalSeconds=0
}


preload {
    # Generate ungenerated chunks around players who stand still while the server is not busy.
    B:enabled=true

    # Ticks a preloaded chunk stays loaded so its neighbours can populate it, then it is released.
    # Min: 20
    # Max: 6000
    I:holdTicks=200

    # At most one chunk is generated every this many ticks.
    # Min: 1
    # Max: 200
    I:intervalTicks=2

    # Safety cap on chunks held loaded by preload.
    # Min: 16
    # Max: 4096
    I:maxHeldChunks=600

    # Preload only runs when the average tick and the current tick are both under this many ms.
    # Min: 1.0
    # Max: 50.0
    D:maxTickMs=20.0

    # Chunk radius around the player to preload.
    # Min: 1
    # Max: 32
    I:radius=10

    # Ticks a player must stand still before preloading starts.
    # Min: 1
    # Max: 1200
    I:stationaryTicks=40
}


throttle {
    # Chunks within this many chunks of a player (0 = only the chunk they stand in) always load immediately.
    # Min: 0
    # Max: 4
    I:emergencyRadius=1

    # Master switch for the adaptive chunk throttle.
    B:enabled=true

    # When the average non-chunk tick work is below this many ms the server is idle and chunks load at full vanilla speed.
    # Min: 0.0
    # Max: 50.0
    D:idleTickMs=15.0

    # Guarantee at least one generated chunk every this many ticks (4 = 0.2 s), so loading never starves.
    # Min: 1
    # Max: 200
    I:maxStarveTicks=4

    # Pause throttled loading on the tick of a world save (autosave every 900 ticks, /save-all) and this many ticks after.
    # Min: 0
    # Max: 20
    I:savePauseTicks=1

    # Target server tick work in ms. Chunk generation only gets the headroom left under this.
    # Min: 5.0
    # Max: 50.0
    D:targetTickMs=40.0

    # Ticks after a player joins during which their chunks load without limits (200 = 10 s).
    # Min: 0
    # Max: 6000
    I:warmupTicks=200
}


